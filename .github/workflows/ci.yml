name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: gateway_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway_test
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/gateway_test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: gateway_test
            POSTGRES_PORT: 5432
            PORT: 3000

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Instalar dependências
              run: npm ci

            - name: Gerar Prisma Client
              run: npx prisma generate

            - name: Aplicar migrations no banco de teste
              run: npx prisma migrate deploy

            - name: Lint
              run: npx eslint "{src,apps,libs,test}/**/*.ts"

            - name: Build
              run: npm run build

            - name: Testes unitários
              run: npm run test

            - name: Testes e2e
              run: npm run test:e2e
